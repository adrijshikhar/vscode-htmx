name: Publish Extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target ("all", "marketplace", "openvsx")'
        required: true
        default: 'all'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    environment: vscode-htmx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Package extension bundle
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-git-tag-version --no-dependencies

      - name: Publish to VS Code Marketplace
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'marketplace' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "Publishing using VSCE_PAT secret..."
            npx --yes @vscode/vsce publish -p "$VSCE_PAT" --no-git-tag-version --no-dependencies
          else
            echo "Publishing using Trusted Publishing (OIDC)..."
            npx --yes @vscode/vsce publish --no-git-tag-version --no-dependencies
          fi

      - name: Publish to Open VSX Registry (optional)
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'openvsx' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish --packagePath $(ls vscode-htmx-*.vsix) -p "$OVSX_PAT"
          else
            echo "OVSX_PAT not set; skipping Open VSX publish."
          fi

      - name: Create GitHub Release with VSIX Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-htmx-*.vsix
          generate_release_notes: true
